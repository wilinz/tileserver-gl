name: Fork Build

on:
  push:
    branches:
      - patched-v5.6.0
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:5.6.0-24.22.1
            ghcr.io/${{ github.repository }}:latest

      - name: Verify Node version
        run: |
          nodev=$(docker run --rm --entrypoint node \
            ghcr.io/${{ github.repository }}:5.6.0-24.22.1 -v | sed 's/^v//')
          echo "node=$nodev"
          major=${nodev%%.*}; rest=${nodev#*.}; minor=${rest%%.*}; patch=${rest#*.}; patch=${patch%%.*}
          if [ "$major" -lt 24 ] || \
             { [ "$major" -eq 24 ] && [ "$minor" -lt 22 ]; } || \
             { [ "$major" -eq 24 ] && [ "$minor" -eq 22 ] && [ "$patch" -lt 1 ]; }; then
            echo "Node $nodev is older than 24.22.1"; exit 1
          fi
